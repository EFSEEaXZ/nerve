/* AniVerse semantic themes: no remote CSS or runtime dependencies. */

*{box-sizing:border-box}
html,body{margin:0;height:100%}

.side{position:sticky;top:0;height:100vh;border-right:0;background:var(--bg);display:flex;flex-direction:column;padding:14px 10px}

<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span id="logo"></span><b>nerve</b><span class="ver" id="ver"></span></div>

    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <div class="main">
    <div class="top">
      <button class="btn icon ghost mobile-nav" id="mnav" aria-label="Menu"></button>
      <h1 id="title"></h1>
      <span class="sp"></span>
      <button class="search-btn" id="openPal" aria-label="Search"><span id="sIco"></span><span class="lbl">Search or run a command</span><span class="kbd">Ctrl K</span></button>
      <button class="btn icon ghost" id="theme" aria-label="Toggle theme"></button>
    </div>
    <div id="offline"></div>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script>

/* ---------- icons (1.6px stroke, 24 grid) ---------- */
const P={

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ms=t=>!t?0:(t<1e12?t*1000:t);
function ago(t){t=ms(t);if(!t)return"never";let s=Math.max(0,(Date.now()-t)/1000);if(s<5)return"just now";if(s<60)return Math.floor(s)+"s ago";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago"}
function dur(m){let s=Math.floor((m||0)/1000);const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const mi=Math.floor(s/60);s%=60;if(d)return`${d}d ${h}h`;if(h)return`${h}h ${mi}m`;if(mi)return`${mi}m ${s}s`;return`${s}s`}
const when=t=>t?new Date(ms(t)).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
const bytes=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB";
async function api(path){const r=await fetch(path,{cache:"no-store",signal:AbortSignal.timeout(10000)});if(!r.ok)throw new Error((await r.text())||r.statusText);return r.json()}
async function act(action,extra={},quiet=false){
  try{const r=await fetch("/api/action",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action,...extra}),signal:AbortSignal.timeout(30000)});
    const j=await r.json().catch(()=>({ok:false,message:r.statusText}));
    if(!quiet||!j.ok)toast(j.message||(j.ok?"done":"failed"),!j.ok);return j}
  catch(e){toast(String(e.message||e),true);return{ok:false}}
}
function toast(msg,bad=false){const t=document.createElement("div");t.className="toast"+(bad?" bad":"");t.innerHTML=`<span class="dot" style="color:var(--${bad?"bad":"ok"})"></span><div>${esc(msg)}</div>`;$("#toasts").append(t);setTimeout(()=>t.remove(),bad?7000:3200)}
async function copy(text,label="Copied"){try{await navigator.clipboard.writeText(text)}catch{const a=document.createElement("textarea");a.value=text;document.body.append(a);a.select();document.execCommand("copy");a.remove()}toast(label)}
function stateBadge(s){const m={running:"ok",online:"ok",disabled:"",stopped:"",error:"bad",starting:"warn",connecting:"warn",offline:"bad"};const c=m[s]??"warn";return`<span class="badge ${c}"><span class="dot${c==="ok"?" live":""}"></span>${esc(s||"unknown")}</span>`}

function hlLog(t){return esc(t).split("\n").map(l=>/\b(ERROR|error|failed|panic|Traceback)\b/.test(l)?`<span class="hl-err">${l}</span>`:/\b(WARN|warn|warning)\b/.test(l)?`<span class="hl-warn">${l}</span>`:l).join("\n")}

  const cnt={sessions:active||"",jobs:st?.jobs_running||"",tools:st?.tools?.length||"",plugins:bad?`${bad} err`:plugs.length||"",skills:S.skills?.skills?.length||""};

}

    <div>
      <div class="row" style="margin-bottom:10px">${stateBadge(tn.state||"local only")}<span class="badge">${esc(tn.provider||"no tunnel")}</span>${st.supervised?`<span class="badge">service</span>`:""}${st.elevated?`<span class="badge">admin</span>`:""}</div>

    <div class="card stat"><div class="k">${I("tool")}Tools</div><div class="v">${st.tools.length}</div><div class="s">${okP}/${plugs.length} plugins up</div></div>

};

V.sessions=()=>{
  const d=S.state;if(!d)return"";const all=S.ui.allSessions;

function schemaRows(sc){
  const props=sc?.properties||{};const req=new Set(sc?.required||[]);const keys=Object.keys(props);
  if(!keys.length)return`<div class="faint">No parameters.</div>`;
  return `<table><thead><tr><th>Parameter</th><th>Type</th><th>Description</th></tr></thead><tbody>${keys.map(k=>{const p=props[k]||{};let ty=p.type||(p.oneOf?"any":"");if(ty==="array"&&p.items?.type)ty=p.items.type+"[]";
    return`<tr><td class="mono" style="white-space:nowrap">${esc(k)}${req.has(k)?`<span style="color:var(--acc)"> *</span>`:""}</td><td class="mono muted">${esc(ty)}</td><td class="muted" style="font-size:13px">${esc(p.description||"")}${p.enum?`<div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap">${p.enum.map(e=>`<span class="chip">${esc(e)}</span>`).join("")}</div>`:""}</td></tr>`}).join("")}</tbody></table>`;
}
function actionsOf(desc){const m=String(desc).match(/Actions?:\s*([\s\S]*)/);if(!m)return[];const out=[];const re=/(?:^|[;.]\s+)([a-z_]+(?:\/[a-z_]+)*)\s*(\{[^}]*\})?/g;let x;while((x=re.exec(m[1]))&&out.length<40){if(x[1].length>1)out.push(x[1])}return[...new Set(out)]}
V.tools=()=>{

    `<input class="inp" id="toolQ" placeholder="Filter tools" value="${esc(S.ui.toolQ||"")}" style="width:240px">`)+

function parseEnv(text){
  const lines=text.split(/\r?\n/);let a=lines.findIndex(l=>/^\s*\[env\]\s*$/.test(l));
  if(a<0)return{lines,a:-1,b:-1,vars:[],notes:[]};
  let b=a+1;while(b<lines.length&&!/^\s*\[/.test(lines[b]))b++;
  const vars=[],notes=[];let pend=[];
  for(let i=a+1;i<b;i++){const l=lines[i];if(!l.trim()){if(pend.length){notes.push(...pend);pend=[]}continue}
    const m=l.match(/^\s*(#\s*)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$/);
    if(m){let rest=m[3].trim(),val="",tail="";
      if(rest[0]==='"'){let j=1;while(j<rest.length&&!(rest[j]==='"'&&rest[j-1]!=="\\"))j++;try{val=JSON.parse(rest.slice(0,j+1))}catch{val=rest.slice(1,j)}tail=rest.slice(j+1)}
      else if(rest[0]==="'"){const j=rest.indexOf("'",1);val=rest.slice(1,j<0?undefined:j);tail=j<0?"":rest.slice(j+1)}
      else{const j=rest.indexOf("#");val=(j<0?rest:rest.slice(0,j)).trim();tail=j<0?"":rest.slice(j)}
      tail=tail.replace(/^\s*#?\s*/,"").trim();
      vars.push({key:m[2],val:String(val),on:!m[1],hints:pend.map(x=>x.replace(/^\s*#\s?/,"")),tail});pend=[]}
    else if(/^\s*#/.test(l))pend.push(l);else pend.push("# "+l)}
  notes.push(...pend);return{lines,a,b,vars,notes};
}
function tomlStr(v){return v.includes("'")||/[\n\r]/.test(v)?JSON.stringify(v):`'${v}'`}
function buildEnv(text,vars){
  const p=parseEnv(text);const body=[];
  for(const v of vars){if(!v.key)continue;for(const h of v.hints)body.push("# "+h);body.push(`${v.on?"":"# "}${v.key} = ${tomlStr(v.val)}${v.tail?"   # "+v.tail:""}`)}
  if(p.a<0){const out=text.replace(/\s*$/,"");return out+"\n\n[env]\n"+body.join("\n")+"\n"}
  const before=p.lines.slice(0,p.a+1),after=p.lines.slice(p.b);
  return[...before,...body,...(p.notes.length?p.notes:[]),...(after.length?["",...after]:[""])].join("\n").replace(/\n{3,}/g,"\n\n");
}
const secretKey=k=>/TOKEN|SECRET|PASSWORD|API_?KEY|AUTH/i.test(k);
function opts(tail){const m=tail&&tail.split("|").map(s=>s.trim().split(/\s/)[0]).filter(Boolean);return m&&m.length>1?m:null}

  const draw=async()=>{const job=S.state?.jobs.find(x=>x.id===id)||j;let text="";try{const r=await fetch(`/api/log?kind=${S.ui.jobStream}&id=${encodeURIComponent(id)}&n=500`,{cache:"no-store"});text=await r.text()}catch{}
    if(S.ui.job!==id)return;const box=$("#jlog");const keep=box&&box.scrollTop+box.clientHeight>=box.scrollHeight-30;
    $("#layer").innerHTML=`<div class="ovl" data-close style="padding:0;background:rgba(0,0,0,.35)"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Job ${esc(id)}"><div class="card-h"><div style="min-width:0;flex:1"><div class="row">${jobBadge(job)}<span class="mono faint">${esc(id)}</span></div><div class="mono clip" style="margin-top:6px;max-width:100%">${esc(job.command)}</div></div>${job.running?`<button class="btn danger" data-act="job_kill" data-id="${esc(id)}">${I("stop")}Stop</button>`:""}<button class="btn icon ghost" data-close aria-label="Close">${I("x")}</button></div>
     <div class="body"><dl class="kv" style="grid-template-columns:90px 1fr;margin-bottom:18px"><dt>Label</dt><dd>${esc(job.label||"—")}</dd><dt>PID</dt><dd class="mono">${job.pid}</dd><dt>Started</dt><dd>${when(job.started)} · ${ago(job.started)}</dd><dt>Duration</dt><dd>${dur(job.elapsed_ms)}</dd></dl>
     <div class="row" style="margin-bottom:10px"><div class="seg"><button data-stream="job" class="${S.ui.jobStream==="job"?"on":""}">stdout</button><button data-stream="job_err" class="${S.ui.jobStream==="job_err"?"on":""}">stderr</button></div></div>
     <pre class="pre" id="jlog" style="max-height:none;min-height:300px">${hlLog(text||"(no output)")}</pre></div></aside>`;
    const nb=$("#jlog");if(nb&&(keep||!box))nb.scrollTop=nb.scrollHeight};
  clearInterval(drawerTimer);await draw();drawerTimer=setInterval(()=>{if(S.ui.job===id)draw();else clearInterval(drawerTimer)},2000);
}
let layerOpener=null;
function closeLayer(){S.ui.job=null;clearInterval(drawerTimer);$("#layer").innerHTML="";if(layerOpener?.isConnected)layerOpener.focus();layerOpener=null}

/* ---------- modal ---------- */
function modal(title,bodyHtml,okLabel,onOk){
  layerOpener=document.activeElement;
  $("#layer").innerHTML=`<div class="ovl" data-close><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="card-h"><h3>${esc(title)}</h3><span class="sp"></span><button class="btn icon ghost sm" data-close aria-label="Close">${I("x")}</button></div><div class="card-b">${bodyHtml}</div><div class="foot"><button class="btn" data-close>Cancel</button><button class="btn pri" id="mok">${esc(okLabel)}</button></div></div></div>`;
  const f=$("#layer input");f&&f.focus();
  const dialog=$("#layer .modal"),submit=$("#mok");
  submit.onclick=async()=>{submit.disabled=true;try{const r=await onOk();if(!dialog.isConnected)return;if(r!==false)closeLayer();else submit.disabled=false}catch(e){if(dialog.isConnected){submit.disabled=false;toast(e.message||"Install failed",true)}}};
  $("#layer").querySelectorAll("input").forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")$("#mok").click()}));
}
function confirmBox(text,ok){modal("Are you sure?",`<div class="muted">${esc(text)}</div>`,"Confirm",ok)}

/* ---------- command palette ---------- */
function palItems(){
  const st=S.state?.status;const it=ROUTES.map(r=>({t:r.t,i:r.i,k:"Go to",run:()=>go(r.id)}));
  it.push({t:"Restart nerve",i:"power",k:"Action",run:()=>act("restart")},{t:"Restart tunnel",i:"globe",k:"Action",run:()=>act("tunnel_restart")},{t:"Toggle theme",i:"sun",k:"Action",run:toggleTheme},{t:"New skill",i:"plus",k:"Action",run:()=>go("skills","new")});
  if(st?.public_url)it.push({t:"Copy public MCP URL",i:"copy",k:"Action",run:()=>copy(st.public_url.replace(/\/$/,"")+"/mcp","MCP URL copied")});
  for(const p of st?.plugins||[])it.push({t:p.name,i:"plug",k:"Plugin",run:()=>go("plugins",p.name)});
  for(const s of S.skills?.skills||[])it.push({t:s.name,i:"book",k:"Skill",run:()=>go("skills",s.name)});
  for(const n of st?.tools||[])it.push({t:n,i:"tool",k:"Tool",run:()=>{S.ui.toolOpen=n;go("tools",n)}});
  return it;
}
function openPal(){
  layerOpener=document.activeElement;
  let sel=0,items=palItems(),shown=items;
  $("#layer").innerHTML=`<div class="ovl" data-close><div class="pal" role="dialog" aria-modal="true" aria-label="Command palette"><input id="palq" placeholder="Type a page, plugin, skill, tool or action" autocomplete="off"><div class="res" id="palr"></div></div></div>`;
  const q=$("#palq"),r=$("#palr");
  const draw=()=>{const s=q.value.toLowerCase().trim();shown=items.filter(x=>!s||x.t.toLowerCase().includes(s)||x.k.toLowerCase().includes(s)).slice(0,40);sel=Math.min(sel,Math.max(0,shown.length-1));
    r.innerHTML=shown.map((x,i)=>`<div class="it ${i===sel?"on":""}" data-i="${i}">${I(x.i)}<span>${esc(x.t)}</span><span class="t">${x.k}</span></div>`).join("")||`<div class="empty">Nothing found</div>`;
    r.querySelector(".on")?.scrollIntoView({block:"nearest"})};
  const run=i=>{const x=shown[i];if(!x)return;closeLayer();x.run()};
  q.oninput=()=>{sel=0;draw()};
  q.onkeydown=e=>{if(e.key==="ArrowDown"){sel=Math.min(sel+1,shown.length-1);draw();e.preventDefault()}else if(e.key==="ArrowUp"){sel=Math.max(sel-1,0);draw();e.preventDefault()}else if(e.key==="Enter"){run(sel)}else if(e.key==="Escape")closeLayer()};
  r.onclick=e=>{const t=e.target.closest("[data-i]");if(t)run(+t.dataset.i)};
  draw();q.focus();
}

/* ---------- theme ---------- */
function applyTheme(){const t=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.theme=t;$("#theme").innerHTML=I(t==="light"?"moon":"sun")}
function toggleTheme(){const t=document.documentElement.dataset.theme==="light"?"dark":"light";document.documentElement.dataset.theme=t;try{localStorage.setItem("nerve-theme",t)}catch{}applyTheme();act("theme",{text:t},true)}

/* ---------- render + events ---------- */
function render(){
  renderNav();
  const a=document.activeElement;const id=a&&a.id;const pos=a&&a.selectionStart;
  const keepScroll=["mtext","cfgtext","sktext"].map(k=>[k,$("#"+k)?.scrollTop]);
  $("#view").innerHTML=V[S.route]();
  if(id){const n=document.getElementById(id);if(n&&n!==document.body){n.focus();try{n.setSelectionRange(pos,pos)}catch{}}}
  for(const [k,t] of keepScroll){const n=$("#"+k);if(n&&t)n.scrollTop=t}
  if(S.route==="logs")loadLog();
}
const editing=()=>{const a=document.activeElement;return a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.id!=="toolQ"&&a.id!=="skQ"))||S.ui.skillDirty||S.ui.envDirty||$("#layer").innerHTML}

document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-go],[data-copy],[data-job],[data-tool],[data-close],a");if(!t)return;const ds=t.dataset;
  if(ds.close!==undefined&&(e.target===t||t.tagName==="BUTTON")){closeLayer();return}
  if(ds.copy){copy(ds.copy);return}
  if(ds.go!==undefined&&!t.matches("input")){const [a,b]=ds.go.split("/");if(S.route==="skills"&&S.ui.skillDirty&&!confirm("Discard unsaved changes?"))return;S.ui.skillDirty=false;S.ui.envDirty=false;S.ui.ptab=a==="plugins"&&b?S.ui.ptab:"settings";go(a,b?decodeURIComponent(b):null);return}
  if(ds.job&&!e.target.closest("button")){openJob(ds.job);return}
  if(ds.tool){S.ui.toolOpen=S.ui.toolOpen===ds.tool?"__none":ds.tool;if(S.arg)history.replaceState(null,"","#tools");S.arg=null;render();return}
  if(ds.ui){const [k,v]=ds.ui.split(":");S.ui[k]=v==="0"?false:v==="1"?true:v;render();return}
  if(ds.act){const run=async()=>{const r=await act(ds.act,{id:ds.id,name:ds.name});await refresh();if(ds.act==="plugin_reload"&&ds.name)setTimeout(()=>loadPlugin(ds.name),800);if(S.ui.job)openJob(S.ui.job);return r.ok};
    if(ds.confirm)confirmBox(ds.confirm,run);else run();return}
  if(ds.stream){S.ui.jobStream=ds.stream;openJob(S.ui.job);return}
  if(ds.logkind){S.ui.logKind=ds.logkind;S.ui.logText="loading…";render();return}
  if(ds.ptab){S.ui.ptab=ds.ptab;if(ds.ptab==="logs"&&S.arg)loadPlugin(S.arg);render();return}
  if(ds.preload){loadPlugin(ds.preload);return}
  if(ds.reveal!==undefined){const i=$(`[data-envval="${ds.reveal}"]`);i.type=i.type==="password"?"text":"password";return}
  if(ds.envadd!==undefined){S.ui.penv[S.arg].push({key:"",val:"",on:true,hints:[],tail:"",isNew:true});S.ui.envDirty=true;render();$(`[data-envkey="${S.ui.penv[S.arg].length-1}"]`)?.focus();return}
  if(ds.envdel!==undefined){S.ui.penv[S.arg].splice(+ds.envdel,1);S.ui.envDirty=true;render();return}
  if(ds.envreset!==undefined){delete S.ui.penv[S.arg];S.ui.envDirty=false;render();return}
  if(ds.envsave){const name=ds.envsave;const vars=S.ui.penv[name];const bad=vars.find(v=>v.key&&!/^[A-Za-z_][A-Za-z0-9_]*$/.test(v.key));if(bad){toast(`“${bad.key}” is not a valid variable name`,true);return}
    const text=buildEnv(S.ui.pinfo[name].manifest,vars);const r=await act("plugin_save",{name,text});if(r.ok){S.ui.envDirty=false;setTimeout(()=>{loadPlugin(name);refresh()},1500)}return}
  if(ds.msave){const name=ds.msave;const r=await act("plugin_save",{name,text:$("#mtext").value});if(r.ok)setTimeout(()=>{loadPlugin(name);refresh()},1500);return}
  if(ds.cfgsave!==undefined){const r=await act("config_save",{text:$("#cfgtext").value});if(r.ok){S.ui.cfg.text=$("#cfgtext").value}return}
  if(ds.upcheck!==undefined){t.disabled=true;await act("update_check");await refresh();return}
  if(ds.update!==undefined){t.disabled=true;await act("update");await refresh();return}
  if(ds.pinset!==undefined){const p=$("#pin").value;const r=await act("pin_set",{pin:p});if(r.ok){$("#pin").value="";refresh()}return}
  if(ds.tokcreate!==undefined){const n=$("#tokname").value.trim();const r=await act("token_create",{name:n});if(r.ok){S.ui.newToken=r.token;await refresh()}return}
  if(ds.sksave){const text=$("#sktext").value;const isNew=ds.sksave==="new";const m=text.match(/^\s*---[\s\S]*?\bname:\s*["']?([^"'\n]+)/);
    const r=await skillsCall({action:"save",body:text,overwrite:!isNew,...(isNew?{}:{name:ds.sksave})},false);
    if(r.ok){S.ui.skillDirty=false;S.ui.newSkill=null;S.ui.skill=null;await loadSkills();const nm=(m&&m[1].trim())||ds.sksave;go("skills",nm)}return}
  if(ds.skdel){const n=ds.skdel;confirmBox(`Delete skill ${n}? It is moved to the .trash folder, not erased.`,async()=>{const r=await skillsCall({action:"delete",name:n},false);if(r.ok){S.ui.skill=null;await loadSkills();go("skills")}return r.ok});return}
  if(ds.skinstall!==undefined){modal("Install skills",`<div class="field"><label for="srcu">GitHub URL, local folder or .zip</label><input class="inp mono" id="srcu" placeholder="https://github.com/anthropics/skills/tree/main/skills/pptx"></div><div class="faint" style="font-size:12px">A repo with many skills installs all of them. Existing skills are skipped.</div>`,"Install",async()=>{const v=$("#srcu").value.trim();if(!v)return false;const r=await skillsCall({action:"install",source:v},false);if(r.ok)loadSkills();return r.ok});return}
  if(ds.newplugin!==undefined){modal("New plugin",`<div class="field"><label for="pn">Name</label><input class="inp mono" id="pn" placeholder="my-tool"></div><div class="field"><label for="pd">What it does</label><input class="inp" id="pd" placeholder="One line, shown to the AI"></div><div class="faint" style="font-size:12px">Creates a Python plugin from the template. Edit its <span class="mono">server.py</span> and nerve reloads it.</div>`,"Create",async()=>{const n=$("#pn").value.trim();if(!/^[a-z0-9][a-z0-9_-]*$/.test(n)){toast("Use lowercase letters, digits, - and _",true);return false}const r=await act("plugin_new",{name:n,text:$("#pd").value.trim()});if(r.ok){await refresh();go("plugins",n)}return r.ok});return}
});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.ptoggle){act(t.checked?"plugin_enable":"plugin_disable",{name:t.dataset.ptoggle}).then(()=>refresh());return}
  if(t.dataset.envon!==undefined){S.ui.penv[S.arg][+t.dataset.envon].on=t.checked;S.ui.envDirty=true;render();return}
  if(t.id==="logN"){S.ui.logN=+t.value;loadLog()}
  if(t.id==="logFollow"){S.ui.logFollow=t.checked}
});
let gt;
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="toolQ"){S.ui.toolQ=t.value;render()}
  else if(t.id==="skQ"){S.ui.skQ=t.value;render()}
  else if(t.id==="sktext"){S.ui.skillDirty=true;if(S.arg==="new")S.ui.newSkill=t.value}
  else if(t.dataset.envval!==undefined){S.ui.penv[S.arg][+t.dataset.envval].val=t.value;S.ui.envDirty=true}
  else if(t.dataset.envkey!==undefined){S.ui.penv[S.arg][+t.dataset.envkey].key=t.value.trim();S.ui.envDirty=true}
  else if(t.id==="logGrep"){S.ui.logGrep=t.value;clearTimeout(gt);gt=setTimeout(loadLog,300)}
});
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPal();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){const b=$("[data-sksave],[data-msave],[data-cfgsave],[data-envsave]");if(b&&!b.disabled){e.preventDefault();b.click()}return}
  if(e.key==="Escape"&&$("#layer").innerHTML){e.preventDefault();closeLayer();return}
  if(e.key==="Tab"){
    const d=$("#layer [role=dialog]");if(d){const f=[...d.querySelectorAll('button:not(:disabled),input:not(:disabled),select,textarea,a[href],[tabindex="0"]')].filter(e=>e.getClientRects().length);const first=f[0],last=f[f.length-1];if(f.length&&((e.shiftKey&&document.activeElement===first)||(!e.shiftKey&&document.activeElement===last)||!d.contains(document.activeElement))){e.preventDefault();(e.shiftKey?last:first).focus()}}
  }
  if(e.key==="Enter"&&e.target.classList?.contains("pcard"))e.target.click();
  if(e.key==="Tab"&&e.target.id&&["sktext","mtext","cfgtext"].includes(e.target.id)){e.preventDefault();const t=e.target,s=t.selectionStart;t.setRangeText("  ",s,t.selectionEnd,"end");t.dispatchEvent(new Event("input",{bubbles:true}))}
});
window.addEventListener("hashchange",()=>{parseHash();if(S.route!=="tools")S.ui.toolOpen=null;closeLayer();render();window.scrollTo(0,0)});
window.addEventListener("beforeunload",e=>{if(S.ui.skillDirty||S.ui.envDirty){e.preventDefault();e.returnValue=""}});

let refreshing=false;
async function refresh(){
  if(refreshing)return; refreshing=true;
  try{
  try{S.state=await api("/api/state");S.offline=false}catch{S.offline=true}
  if(!S.tools||S.ui.toolsAt!==(S.state?.status.tools||[]).join()){try{S.tools=await api("/api/tools");S.ui.toolsAt=(S.state?.status.tools||[]).join()}catch{}}
  if(editing())renderNav();else render();
  }finally{refreshing=false}
}
$("#logo").innerHTML=LOGO;$("#sIco").innerHTML=I("search");$("#mnav").innerHTML=I("menu");
$("#mnav").onclick=openPal;$("#openPal").onclick=openPal;$("#theme").onclick=toggleTheme;
applyTheme();act("theme",{text:document.documentElement.dataset.theme},true);parseHash();render();refresh();loadSkills();
setInterval(()=>{if(!document.hidden)refresh()},3000);
setInterval(()=>{if(!document.hidden&&S.route==="logs"&&S.ui.logFollow!==false)loadLog()},2500);
</script>
</body>
</html>
